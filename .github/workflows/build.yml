name: Build Linux Decky plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check frontend types
        run: npm run typecheck
      - name: Build Decky frontend
        run: npm run build
      - name: Run Python tests
        run: npm test
      - name: Build on Ubuntu 20.04 (glibc 2.31)
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work ubuntu:20.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y build-essential cmake git ca-certificates libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev python3 binutils file
            git config --global --add safe.directory /work
            bash scripts/build-native.sh
            bash scripts/check-native.sh
          '
      - name: Package verified Decky ZIP
        run: python3 scripts/package.py
      - name: Verify packaged Decky Python imports
        run: python3 scripts/verify-decky-zip.py release/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hearthstone-hud-linux-x86_64
          path: |
            release/*.zip
            build/*.txt
          if-no-files-found: error
  release:
    # Only a vX.Y.Z tag publishes; branch builds just verify the tree.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json v$version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: hearthstone-hud-linux-x86_64
          path: artifact
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags are vX.Y.Z; the notes files are VX.Y.Z_RELEASE_NOTES.md, and the
          # runner filesystem is case sensitive.
          notes="docs/V${GITHUB_REF_NAME#v}_RELEASE_NOTES.md"
          if [ ! -f "$notes" ]; then
            echo "missing release notes: $notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            artifact/release/hearthstone-hud-*.zip artifact/build/*.txt \
            --title "Hearthstone HUD $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file "$notes"
