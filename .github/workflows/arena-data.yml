name: Update arena data
on:
  schedule:
    - cron: '27 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-data-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate arena data
        run: python3 scripts/update-arena-data.py
      - name: Commit changed snapshots
        run: |
          git add -- data/arena/arena_ratings.json data/arena/arena_class_ratings.json data/arena/manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update arena data'
          git push origin HEAD:refs/heads/main
